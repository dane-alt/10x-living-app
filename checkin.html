<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Check-in — 10X Living</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
<header>
  <nav>
    <a href="index.html">Home</a>
    <a href="join.html">Join</a>
    <a href="constitution.html">Constitution</a>
    <a href="checkin.html">Check-in</a>
    <a href="roles.html">Roles</a>
  </nav>
</header>
<main>
  <h1>Check in, then leave</h1>
  <form id="checkin">
    <label>How do you feel right now?
      <select name="feeling" required>
        <option value="">Choose…</option>
        <option>glad</option>
        <option>tight</option>
        <option>lonely</option>
        <option>tired</option>
        <option>scared</option>
        <option>other</option>
      </select>
    </label>
    <label>Anything the village should know? (optional) <textarea name="note" rows="3"></textarea></label>
    <button class="btn" type="submit">Get one suggestion and close</button>
  </form>
  <div id="suggestion" class="card" hidden>
    <p data-text></p>
    <p class="muted">This page has done its job. Close the tab.</p>
  </div>
</main>
<footer>Only metric: well-being per minute of attention. Close the tab when life is happening.</footer>
<script src="js/metric.js"></script>
<script src="js/checkin.js"></script>
</body>
</html>
